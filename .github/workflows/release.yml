name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package and GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # Pinned from actions/checkout@v7.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        # Pinned from actions/setup-node@v7.0.0.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        # Pinned from oven-sh/setup-bun@v2.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $package_version." >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Pack release candidate
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          pack_json="$(npm pack --json --pack-destination "$RUNNER_TEMP")"
          echo "$pack_json"
          PACK_JSON="$pack_json" node -e '
            const packed = JSON.parse(process.env.PACK_JSON)[0];
            if (!packed || typeof packed.filename !== "string" || !/^[a-z0-9][a-z0-9._-]*\.tgz$/iu.test(packed.filename) ||
                typeof packed.integrity !== "string" || !/^sha512-[A-Za-z0-9+/]+=*$/u.test(packed.integrity)) {
              throw new Error("npm pack returned an invalid release artifact");
            }
            const path = require("node:path");
            console.log("tarball=" + path.join(process.env.RUNNER_TEMP, packed.filename));
            console.log("integrity=" + packed.integrity);
          ' >> "$GITHUB_OUTPUT"

      - name: Verify packed release candidate
        env:
          TARBALL_PATH: ${{ steps.pack.outputs.tarball }}
        run: node scripts/smoke-packed-install.mjs "$TARBALL_PATH"

      - name: Check whether npm version is already published
        id: npm-version
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "published_integrity=$(npm view "$package_name@$package_version" dist.integrity)" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify existing npm package matches current package
        if: steps.npm-version.outputs.published == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.pack.outputs.integrity }}" != "${{ steps.npm-version.outputs.published_integrity }}" ]]; then
            echo "npm already has this version, but its integrity differs from the current package." >&2
            echo "current:   ${{ steps.pack.outputs.integrity }}" >&2
            echo "published: ${{ steps.npm-version.outputs.published_integrity }}" >&2
            exit 1
          fi

      - name: Publish to npm
        if: steps.npm-version.outputs.published == 'false'
        env:
          TARBALL_PATH: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL_PATH" --access public --provenance

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_stable_tag="$(
            git ls-remote --tags --refs origin 'v*.*.*' \
              | sed 's#.*refs/tags/##' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1
          )"
          if [[ -z "$latest_stable_tag" ]]; then
            echo "No stable semver tags found on origin." >&2
            exit 1
          fi
          latest_flag="--latest=false"
          if [[ "$GITHUB_REF_NAME" == "$latest_stable_tag" ]]; then
            latest_flag="--latest"
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [[ "$latest_flag" == "--latest" ]]; then
              gh release edit "$GITHUB_REF_NAME" --verify-tag --latest
            else
              gh release edit "$GITHUB_REF_NAME" --verify-tag
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag "$latest_flag" --generate-notes
          fi
